name: Generate Non-Eating Contribution Snake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/generate_public_snake.py"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate actual contribution calendar with moving purple snake
        env:
          GITHUB_USERNAME: harshbhargav49
        run: python scripts/generate_public_snake.py

      - name: Publish animated SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
